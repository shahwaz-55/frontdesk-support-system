name: Daily Stale Ticket Auto-Close

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  close-stale-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Run stale ticket maintenance
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$BACKEND_URL/api/maintenance/close-stale" \
            --header "x-maintenance-secret: $MAINTENANCE_SECRET"
